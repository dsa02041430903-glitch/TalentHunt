# Drop into your server block (TLS terminated by nginx). The two settings that matter for this app:
#  - proxy_buffering off : search progress is streamed line by line; buffering would hold it all back
#  - proxy_read_timeout  : a hard search can run for a couple of minutes
location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 2m;
}
