# Render blueprint: New > Blueprint, point it at this repo. Render asks for the three secrets marked
# sync:false and generates APP_PASSWORD for you (shown in the service's Environment tab).
services:
  - type: web
    name: talenthunt
    runtime: node
    plan: free # a free service sleeps when idle and wakes slowly; use a paid plan for daily use
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: APP_PASSWORD
        generateValue: true
      - key: SERPER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
